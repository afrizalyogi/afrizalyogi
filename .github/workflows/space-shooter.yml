name: Update Space Shooter

on:
  schedule:
    - cron: "47 1 * * 1"   # weekly, Monday 08:47 WIB (after the cards job)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - run: mkdir -p assets

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/game.gif
          strategy: random
          fps: 25
          no-amend: "true"
          commit-message: "chore: refresh space shooter"

      - name: Pin README images to the new commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase -q
          bash scripts/pin.sh
          git push
