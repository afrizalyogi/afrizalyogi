name: Chess move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q stockfish
          pip install chess

      - name: Play the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Retry so two people moving at the same time can't clobber each other:
          # each attempt starts from the latest board and re-checks the move.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python scripts/chess_game.py issue --reply "$RUNNER_TEMP/reply.md"
            git add README.md assets/chess-board.svg chess/state.json
            git diff --cached --quiet && break
            git commit -q -m "chess: @$ISSUE_USER $ISSUE_TITLE"
            git push -q origin "HEAD:$BRANCH" && break
            sleep $((attempt * 3))
          done

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
