<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess · afrizalyogi</title>
<style>
  :root { --bg:#0d1117; --panel:#0f161f; --border:#1e2a36; --text:#e6edf3; --muted:#8b949e; --accent:#3ddc97; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#010409; color:var(--text);
         font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  .card { width:min(860px,96vw); background:var(--bg); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:8px; padding:12px 18px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; } .bar .r { margin-left:auto; color:var(--accent); }
  .body { display:flex; flex-wrap:wrap; gap:28px; padding:22px; }
  #board { display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); width:min(400px,88vw); aspect-ratio:1; }
  .sq { display:grid; place-items:center; font-size:min(34px,8vw); cursor:pointer; user-select:none; position:relative; }
  .l { background:#24333f; } .d { background:#1b2733; }
  .w { color:var(--text); } .b { color:var(--accent); }
  .sel { box-shadow: inset 0 0 0 3px var(--accent); }
  .last::before, .chk::before { content:""; position:absolute; inset:0; }
  .last::before { background:var(--accent); opacity:.22; } .chk::before { background:var(--danger); opacity:.4; }
  .hint::after { content:""; width:22%; height:22%; border-radius:50%; background:var(--accent); opacity:.55; position:absolute; }
  .side { flex:1; min-width:220px; }
  h1 { font-size:20px; margin:4px 0 6px; } p { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .k { color:var(--accent); font-size:12px; margin-bottom:8px; }
  #log { font-size:13px; line-height:1.8; min-height:120px; max-height:220px; overflow:auto; margin-bottom:18px; }
  #log span { color:var(--accent); }
  button, a.btn { font:inherit; font-size:13px; color:var(--accent); background:var(--panel); border:1px solid var(--accent);
           border-radius:20px; padding:8px 16px; cursor:pointer; text-decoration:none; margin-right:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>&nbsp; chess.play<span class="r">● live</span></div>
  <div class="body">
    <div id="board"></div>
    <div class="side">
      <h1 id="status">Your move: White</h1>
      <p>Click a piece, then a highlighted square. The bot plays Black.</p>
      <div class="k">&gt; moves</div>
      <div id="log"></div>
      <button id="new">↻ New game</button><a class="btn" href="https://github.com/afrizalyogi">← Profile</a>
    </div>
  </div>
</div>
<script type="module">
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js";

const G = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const V = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
const game = new Chess();
let sel = null, last = null;
const $ = (id) => document.getElementById(id);

// Material + small centre bonus, from Black's point of view.
function evaluate() {
  let s = 0;
  game.board().forEach((row, r) => row.forEach((p, f) => {
    if (!p) return;
    const centre = (3.5 - Math.abs(3.5 - r)) + (3.5 - Math.abs(3.5 - f));
    const v = V[p.type] + (p.type === "p" || p.type === "n" ? centre * 4 : 0);
    s += p.color === "b" ? v : -v;
  }));
  return s;
}

function search(depth, a, b, max) {
  if (game.isCheckmate()) return max ? -1e6 : 1e6;
  if (game.isDraw()) return 0;
  if (depth === 0) return evaluate();
  const moves = game.moves({ verbose: true }).sort((x, y) => (y.captured ? V[y.captured] : 0) - (x.captured ? V[x.captured] : 0));
  for (const m of moves) {
    game.move(m);
    const v = search(depth - 1, a, b, !max);
    game.undo();
    if (max) a = Math.max(a, v); else b = Math.min(b, v);
    if (b <= a) break;
  }
  return max ? a : b;
}

function botMove() {
  let best = null, bestV = -Infinity;
  const moves = game.moves({ verbose: true }).sort(() => Math.random() - 0.5);
  for (const m of moves) {
    game.move(m);
    const v = search(1, -Infinity, Infinity, false);
    game.undo();
    if (v > bestV) { bestV = v; best = m; }
  }
  return game.move(best);
}

function render() {
  const el = $("board"), hints = sel ? game.moves({ square: sel, verbose: true }).map((m) => m.to) : [];
  const kingSq = game.inCheck() && game.board().flat().find((p) => p && p.type === "k" && p.color === game.turn())?.square;
  el.innerHTML = "";
  game.board().forEach((row, r) => row.forEach((p, f) => {
    const sq = "abcdefgh"[f] + (8 - r), d = document.createElement("div");
    d.className = `sq ${(r + f) % 2 ? "d" : "l"}`;
    if (sq === sel) d.classList.add("sel");
    if (hints.includes(sq)) d.classList.add("hint");
    if (last && (sq === last.from || sq === last.to)) d.classList.add("last");
    if (sq === kingSq) d.classList.add("chk");
    if (p) { d.textContent = G[p.type] + "\uFE0E"; d.classList.add(p.color); }
    d.onclick = () => click(sq);
    el.appendChild(d);
  }));
  $("status").textContent = game.isCheckmate() ? (game.turn() === "w" ? "Checkmate. Bot wins." : "Checkmate. You win!")
    : game.isDraw() ? "Draw." : game.turn() === "w" ? (game.inCheck() ? "Check! Your move" : "Your move: White") : "Bot is thinking…";
  const h = game.history();
  $("log").innerHTML = h.reduce((s, m, i) => s + (i % 2 ? ` <span>${m}</span><br>` : `${i / 2 + 1}. ${m}`), "") || "No moves yet.";
  $("log").scrollTop = 1e9;
}

function click(sq) {
  if (game.turn() !== "w" || game.isGameOver()) return;
  const p = game.get(sq);
  if (sel) {
    const m = game.moves({ square: sel, verbose: true }).find((x) => x.to === sq);
    if (m) {
      last = game.move({ from: sel, to: sq, promotion: "q" });
      sel = null; render();
      if (!game.isGameOver()) setTimeout(() => { last = botMove(); render(); }, 150);
      return;
    }
  }
  sel = p && p.color === "w" ? sq : null;
  render();
}

$("new").onclick = () => { game.reset(); sel = last = null; render(); };
render();
</script>
</body>
</html>
